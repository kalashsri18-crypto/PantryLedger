<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PantryLedger</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap"><header class="hero"><h1>🥫 PantryLedger</h1><p>Keep track of pantry stock, expiry dates and shopping.</p></header><section class="panel"><h2>Add pantry item</h2><form id="add"><input name="name" placeholder="Item name" required><input name="category" placeholder="Category"><input name="quantity" type="number" min="0" step=".1" placeholder="Quantity" required><input name="unit" placeholder="Unit (pcs, kg, L)"><input name="low_stock" type="number" min="0" step=".1" value="1" placeholder="Low-stock at"><input name="expiry_date" type="date"><button>Add item</button></form></section><section class="panel"><h2>Inventory</h2><div id="items" class="items"></div></section><section class="panel"><h2>Shopping list</h2><form id="shop"><input name="item_name" placeholder="Add an item to buy" required><input name="quantity" placeholder="Quantity"><button>Add to list</button></form><div id="shopping" class="items"></div></section></main><script>
const el=id=>document.getElementById(id);async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});let d=r.status===204?null:await r.json();if(!r.ok)throw Error(d?.error||'Request failed');return d}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){let a=await api('/api/items');el('items').innerHTML=a.map(x=>'<article class="item"><div><b>'+esc(x.name)+'</b> <span class="pill">'+esc(x.category)+'</span><p class="muted">'+x.quantity+' '+esc(x.unit)+' · Expiry: '+(x.expiry_date||'not set')+(x.quantity<=x.low_stock?' · LOW STOCK':'')+'</p></div><div class="actions"><button class="secondary" onclick="consume('+x.id+')">Use 1</button><button class="danger" onclick="removeItem('+x.id+')">Delete</button></div></article>').join('')||'<p class="empty">Your pantry is empty. Add your first item.</p>';let s=await api('/api/shopping');el('shopping').innerHTML=s.low_stock.map(x=>'<div class="item"><b>Restock: '+esc(x.name)+'</b><span class="pill">Low stock</span></div>').join('')+s.manual.map(x=>'<div class="item"><span '+(x.done?'style="text-decoration:line-through"':'')+'>'+esc(x.item_name)+' · '+esc(x.quantity)+'</span><button class="secondary" onclick="toggle('+x.id+')">'+(x.done?'Undo':'Bought')+'</button></div>').join('')}
el('add').onsubmit=async e=>{e.preventDefault();try{await api('/api/items',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();load()}catch(x){alert(x.message)}};el('shop').onsubmit=async e=>{e.preventDefault();await api('/api/shopping',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();load()};async function consume(id){try{await api('/api/items/'+id+'/consume',{method:'PATCH',body:JSON.stringify({quantity:1})});load()}catch(e){alert(e.message)}}async function removeItem(id){if(confirm('Remove item?')){await api('/api/items/'+id,{method:'DELETE'});load()}}async function toggle(id){await api('/api/shopping/'+id,{method:'PATCH'});load()}load();
</script></body></html>
